openapi: 3.0.3
info:
  title: mod-server-api
  version: 1.1.0
  description: Runtime HTTP API for an AzerothCore WotLK worldserver. Authentication is selected by provider and defaults to none on localhost; authorization scopes are not implemented.
x-authentication:
  providerSetting: ServerApi.Auth.Provider
  defaultProvider: none
  protectedPaths: [/api/v1/*, /ws/v1/events]
  publicPaths: [/health, /ready]
  providers: Registered by compiled AzerothCore modules; see docs/auth.md.
  providerFailure: {status: 500, errorCode: AUTH_PROVIDER_FAILED}
servers:
  - url: http://127.0.0.1:7878
    description: Default local listener
tags:
  - name: Health
  - name: Server
  - name: Players
  - name: Characters
  - name: Groups
  - name: Instances
  - name: Bots
  - name: Commands
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        '200':
          description: API process is alive
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
  /ready:
    get:
      tags: [Health]
      summary: Readiness probe
      responses:
        '200':
          description: API is ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadyResponse'}
  /api/v1/server:
    get:
      tags: [Server]
      summary: Runtime server snapshot
      responses:
        '200':
          description: Server snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServerSnapshot'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/server/metrics:
    get:
      tags: [Server]
      summary: Runtime server metrics
      responses:
        '200':
          description: Server metrics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServerMetrics'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/modules:
    get:
      tags: [Server]
      summary: List registered API modules and capabilities
      responses:
        '200':
          description: Registered module capabilities
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/ModuleDescriptor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/players:
    get:
      tags: [Players]
      summary: List online players
      parameters:
        - {$ref: '#/components/parameters/Name'}
        - {$ref: '#/components/parameters/MapId'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Online runtime players from the immutable world snapshot
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Player'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/players/{guid}:
    get:
      tags: [Players]
      summary: Get one online player
      parameters: [{$ref: '#/components/parameters/Guid'}]
      responses:
        '200':
          description: Player details
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlayerDetails'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/characters:
    get:
      tags: [Characters]
      summary: List all current-realm characters
      description: Cursor pagination ordered by ascending GUID. Dynamic online/location/bot filters use the current runtime snapshot. No total count is calculated.
      parameters:
        - {$ref: '#/components/parameters/CharacterLimit'}
        - {$ref: '#/components/parameters/CharacterCursor'}
        - {$ref: '#/components/parameters/CharacterName'}
        - {$ref: '#/components/parameters/CharacterAccountId'}
        - {$ref: '#/components/parameters/CharacterOnline'}
        - {$ref: '#/components/parameters/CharacterBot'}
        - {$ref: '#/components/parameters/CharacterBotType'}
        - {$ref: '#/components/parameters/CharacterRace'}
        - {$ref: '#/components/parameters/CharacterClass'}
        - {$ref: '#/components/parameters/CharacterMinLevel'}
        - {$ref: '#/components/parameters/CharacterMaxLevel'}
        - {$ref: '#/components/parameters/CharacterGuildId'}
        - {$ref: '#/components/parameters/CharacterMapId'}
        - {$ref: '#/components/parameters/CharacterZoneId'}
        - {$ref: '#/components/parameters/CharacterIncludeDeleted'}
      responses:
        '200':
          description: Character page; a selective dynamic filter can produce a short page while hasMore remains true.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CharacterPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/CharacterUnavailable'}
  /api/v1/characters/{guid}:
    get:
      tags: [Characters]
      summary: Get an administrative character profile
      parameters: [{$ref: '#/components/parameters/CharacterGuid'}]
      responses:
        '200':
          description: Character profile with equipped items, talent group and profession skills
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CharacterProfile'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/CharacterUnavailable'}
  /api/v1/groups:
    get:
      tags: [Groups]
      summary: List groups visible through online players
      responses:
        '200':
          description: Groups snapshot
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Group'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/groups/{id}:
    get:
      tags: [Groups]
      summary: Get one group
      parameters: [{$ref: '#/components/parameters/ResourceId'}]
      responses:
        '200':
          description: Group snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/instances:
    get:
      tags: [Instances]
      summary: List active dungeon and raid instances
      responses:
        '200':
          description: Instances snapshot
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Instance'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/instances/{instanceId}:
    get:
      tags: [Instances]
      summary: Get one active instance
      parameters: [{$ref: '#/components/parameters/InstanceId'}]
      responses:
        '200':
          description: Instance snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Instance'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/bots:
    get:
      tags: [Bots]
      summary: List online playerbots
      description: Returns 501 when mod-playerbots is not compiled into worldserver.
      responses:
        '200':
          description: Online bots
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Player'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '501': {$ref: '#/components/responses/NotSupported'}
  /api/v1/players/{guid}/kick:
    post:
      tags: [Commands]
      summary: Queue a player kick
      description: The command is executed on the next world update.
      parameters: [{$ref: '#/components/parameters/Guid'}]
      responses:
        '202':
          description: Command queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueuedCommand'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/QueueFull'}
  /api/v1/players/{guid}/teleport:
    post:
      tags: [Commands]
      summary: Queue a player teleport
      parameters:
        - {$ref: '#/components/parameters/Guid'}
        - {name: mapId, in: query, required: true, schema: {type: integer, format: int32, minimum: 0}}
        - {name: x, in: query, required: true, schema: {type: number, format: float}}
        - {name: y, in: query, required: true, schema: {type: number, format: float}}
        - {name: z, in: query, required: true, schema: {type: number, format: float}}
        - {name: orientation, in: query, required: true, schema: {type: number, format: float}}
      responses:
        '202':
          description: Command queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueuedCommand'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/QueueFull'}
components:
  parameters:
    Guid:
      name: guid
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    CharacterGuid:
      name: guid
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1, maximum: 4294967295}
    ResourceId:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    InstanceId:
      name: instanceId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    Name:
      name: name
      in: query
      required: false
      schema: {type: string}
    MapId:
      name: mapId
      in: query
      required: false
      schema: {type: integer, format: int64, minimum: 0, maximum: 4294967295}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 1, maximum: 1000, default: 100}
    CharacterLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 1, maximum: 1000, default: 100}
    CharacterCursor:
      name: cursor
      in: query
      required: false
      description: Exclusive GUID cursor returned as nextCursor by the previous page.
      schema: {type: integer, format: int32, minimum: 0}
    CharacterName:
      name: name
      in: query
      required: false
      description: Case-insensitive name prefix.
      schema: {type: string, maxLength: 64}
    CharacterAccountId:
      name: accountId
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 1}
    CharacterOnline:
      name: online
      in: query
      required: false
      schema: {type: boolean}
    CharacterBot:
      name: bot
      in: query
      required: false
      schema: {type: boolean}
    CharacterBotType:
      name: botType
      in: query
      required: false
      schema: {type: string, enum: [player, random, addclass, unknown]}
    CharacterRace:
      name: race
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 1, maximum: 255}
    CharacterClass:
      name: class
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 1, maximum: 255}
    CharacterMinLevel:
      name: minLevel
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 1, maximum: 255}
    CharacterMaxLevel:
      name: maxLevel
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 1, maximum: 255}
    CharacterGuildId:
      name: guildId
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 1}
    CharacterMapId:
      name: mapId
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 0}
    CharacterZoneId:
      name: zoneId
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 0}
    CharacterIncludeDeleted:
      name: includeDeleted
      in: query
      required: false
      description: Include soft-deleted rows in list results. Deleted profiles remain hidden.
      schema: {type: boolean, default: false}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: The configured authentication provider rejected the request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotSupported:
      description: Optional integration is unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    QueueFull:
      description: World-thread command queue is full
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    CharacterUnavailable:
      description: Character database unavailable or character request capacity reached
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code: {type: string}
            feature: {type: string}
    HealthResponse:
      type: object
      required: [status]
      properties: {status: {type: string, enum: [ok]}}
    ReadyResponse:
      type: object
      required: [status]
      properties: {status: {type: string, enum: [ready]}}
    ServerSnapshot:
      type: object
      required: [realmId, serverTime, uptimeSeconds, playersOnline, botsOnline]
      properties:
        realmId: {type: integer, format: int32}
        serverTime: {type: integer, format: int64}
        uptimeSeconds: {type: integer, format: int64}
        playersOnline: {type: integer, format: int32}
        botsOnline: {type: integer, format: int32}
    ServerMetrics:
      type: object
      required: [activeMaps, activeInstances, playersOnline, botsOnline, eventQueue, commandQueue, droppedEvents]
      properties:
        activeMaps: {type: integer, format: int32}
        activeInstances: {type: integer, format: int32}
        playersOnline: {type: integer, format: int32}
        botsOnline: {type: integer, format: int32}
        eventQueue: {type: integer, format: int64}
        commandQueue: {type: integer, format: int64}
        droppedEvents: {type: integer, format: int64}
    ModuleDescriptor:
      type: object
      required: [name, version, capabilities]
      properties:
        name: {type: string}
        version: {type: string}
        capabilities:
          type: array
          items: {type: string}
    Player:
      type: object
      required: [guid, name, level, class, race, mapId, zoneId, online]
      properties:
        guid: {type: integer, format: int64}
        name: {type: string}
        level: {type: integer, format: int32}
        class: {type: integer, format: int32}
        race: {type: integer, format: int32}
        mapId: {type: integer, format: int32}
        zoneId: {type: integer, format: int32}
        online: {type: boolean, enum: [true]}
    PlayerDetails:
      allOf:
        - {$ref: '#/components/schemas/Player'}
        - type: object
          properties:
            health: {type: object}
            power: {type: object}
            position: {type: object}
    CharacterPage:
      type: object
      required: [data, hasMore, nextCursor]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Character'}
        hasMore: {type: boolean}
        nextCursor: {type: integer, format: int64, nullable: true, maximum: 4294967295}
    Character:
      type: object
      required: [guid, accountId, name, race, class, gender, level, guildId, guildName, online, bot, botType, deleted, mapId, zoneId, location]
      properties:
        guid: {type: integer, format: int64, maximum: 4294967295}
        accountId: {type: integer, format: int64, maximum: 4294967295}
        name: {type: string}
        race: {type: integer, format: int32}
        class: {type: integer, format: int32}
        gender: {type: integer, format: int32}
        level: {type: integer, format: int32}
        guildId: {type: integer, format: int64, maximum: 4294967295}
        guildName: {type: string}
        online: {type: boolean}
        bot: {type: boolean}
        botType: {type: string, enum: [player, random, addclass, unknown]}
        deleted: {type: boolean}
        mapId: {type: integer, format: int32}
        zoneId: {type: integer, format: int32}
        location:
          type: object
          required: [mapId, zoneId, x, y, z, orientation]
          properties:
            mapId: {type: integer, format: int32}
            zoneId: {type: integer, format: int32}
            x: {type: number, format: float}
            y: {type: number, format: float}
            z: {type: number, format: float}
            orientation: {type: number, format: float}
    CharacterProfile:
      allOf:
        - {$ref: '#/components/schemas/Character'}
        - type: object
          required: [xp, money, talents, equipment, professions]
          properties:
            xp: {type: integer, format: int64, maximum: 4294967295}
            money: {type: integer, format: int64, maximum: 4294967295}
            talents:
              type: object
              required: [activeGroup, totalGroups]
              properties:
                activeGroup: {type: integer, format: int32}
                totalGroups: {type: integer, format: int32}
            equipment:
              type: array
              items:
                type: object
                required: [slot, itemEntry]
                properties:
                  slot: {type: integer, format: int32}
                  itemEntry: {type: integer, format: int32}
            professions:
              type: array
              items:
                type: object
                required: [skillId, name, value, max]
                properties:
                  skillId: {type: integer, format: int32}
                  name: {type: string}
                  value: {type: integer, format: int32}
                  max: {type: integer, format: int32}
    Group:
      type: object
      required: [id, leaderGuid, raid, members]
      properties:
        id: {type: integer, format: int64}
        leaderGuid: {type: integer, format: int64}
        raid: {type: boolean}
        members:
          type: array
          items: {type: integer, format: int64}
    Instance:
      type: object
      required: [instanceId, mapId, difficulty, players]
      properties:
        instanceId: {type: integer, format: int32}
        mapId: {type: integer, format: int32}
        difficulty: {type: integer, format: int32}
        players: {type: integer, format: int32}
    QueuedCommand:
      type: object
      required: [status, operation]
      properties:
        status: {type: string, enum: [queued]}
        operation: {type: string}
        guid: {type: integer, format: int64}
