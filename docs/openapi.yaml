openapi: 3.0.3
info:
  title: mod-server-api
  version: 1.1.0
  description: Runtime HTTP API for an AzerothCore WotLK worldserver. Authentication is selected by provider and defaults to none on localhost; authorization scopes are not implemented.
x-authentication:
  providerSetting: ServerApi.Auth.Provider
  defaultProvider: none
  protectedPaths: [/api/v1/*, /ws/v1/events]
  publicPaths: [/health, /ready]
  providers: Registered by compiled AzerothCore modules; see docs/auth.md.
  providerFailure: {status: 500, errorCode: AUTH_PROVIDER_FAILED}
servers:
  - url: http://127.0.0.1:7878
    description: Default local listener
tags:
  - name: Health
  - name: Server
  - name: Accounts
  - name: Players
  - name: Characters
  - name: Groups
  - name: Instances
  - name: Bots
  - name: Commands
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        '200':
          description: API process is alive
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
  /ready:
    get:
      tags: [Health]
      summary: Readiness probe
      responses:
        '200':
          description: API is ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadyResponse'}
  /api/v1/server:
    get:
      tags: [Server]
      summary: Runtime server snapshot
      responses:
        '200':
          description: Server snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServerSnapshot'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/server/metrics:
    get:
      tags: [Server]
      summary: Runtime server metrics
      responses:
        '200':
          description: Server metrics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServerMetrics'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/accounts/capabilities:
    get:
      tags: [Accounts]
      summary: Check account mutation support
      responses:
        '200':
          description: Account creation and security-level updates are available
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountMutationAvailability'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/accounts:
    post:
      tags: [Accounts]
      summary: Create an account and optionally assign its security level
      description: Queues account creation and access assignment through the worldserver. Password is accepted only in the JSON body. securityLevel supports 0 Player, 1 Moderator, 2 Game Master and 3 Administrator. realmId is -1 for all realms or a positive configured realm ID.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountCreateRequest'}
      responses:
        '201':
          description: Account and requested access were confirmed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountOperationResult'}
        '202':
          description: Account operation is still pending confirmation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountOperationResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/BadRequest'}
        '503': {$ref: '#/components/responses/QueueFull'}
  /api/v1/accounts/{accountId}/security:
    post:
      tags: [Accounts]
      summary: Assign an account security level
      parameters:
        - name: accountId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1, maximum: 4294967295}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountSecurityRequest'}
      responses:
        '200':
          description: Requested access was confirmed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountOperationResult'}
        '202':
          description: Access update is still pending confirmation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountOperationResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '415': {$ref: '#/components/responses/BadRequest'}
        '503': {$ref: '#/components/responses/QueueFull'}
  /api/v1/modules:
    get:
      tags: [Server]
      summary: List registered API modules and capabilities
      responses:
        '200':
          description: Registered module capabilities
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/ModuleDescriptor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/players:
    get:
      tags: [Players]
      summary: List online players
      parameters:
        - {$ref: '#/components/parameters/Name'}
        - {$ref: '#/components/parameters/MapId'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Online runtime players from the immutable world snapshot
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Player'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/players/{guid}:
    get:
      tags: [Players]
      summary: Get one online player
      parameters: [{$ref: '#/components/parameters/Guid'}]
      responses:
        '200':
          description: Player details
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlayerDetails'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/characters:
    get:
      tags: [Characters]
      summary: List all current-realm characters
      description: Cursor pagination ordered by ascending GUID. Dynamic online/location/bot filters use the current runtime snapshot. No total count is calculated.
      parameters:
        - {$ref: '#/components/parameters/CharacterLimit'}
        - {$ref: '#/components/parameters/CharacterCursor'}
        - {$ref: '#/components/parameters/CharacterName'}
        - {$ref: '#/components/parameters/CharacterAccountId'}
        - {$ref: '#/components/parameters/CharacterOnline'}
        - {$ref: '#/components/parameters/CharacterBot'}
        - {$ref: '#/components/parameters/CharacterBotType'}
        - {$ref: '#/components/parameters/CharacterRace'}
        - {$ref: '#/components/parameters/CharacterClass'}
        - {$ref: '#/components/parameters/CharacterMinLevel'}
        - {$ref: '#/components/parameters/CharacterMaxLevel'}
        - {$ref: '#/components/parameters/CharacterGuildId'}
        - {$ref: '#/components/parameters/CharacterMapId'}
        - {$ref: '#/components/parameters/CharacterZoneId'}
        - {$ref: '#/components/parameters/CharacterIncludeDeleted'}
        - {$ref: '#/components/parameters/CharacterIncludeTalents'}
        - {$ref: '#/components/parameters/CharacterGUIDs'}
        - {$ref: '#/components/parameters/CharacterExactNames'}
      responses:
        '200':
          description: Character page; a selective dynamic filter can produce a short page while hasMore remains true.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CharacterPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/CharacterUnavailable'}
  /api/v1/characters/{guid}:
    get:
      tags: [Characters]
      summary: Get an administrative character profile
      parameters: [{$ref: '#/components/parameters/CharacterGuid'}]
      responses:
        '200':
          description: Character profile with equipped items, talent group and profession skills
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CharacterProfile'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/CharacterUnavailable'}
  /api/v1/characters/item-levels:
    get:
      tags: [Characters]
      summary: Read average equipped item levels for character GUIDs
      parameters:
        - name: guids
          in: query
          required: false
          description: Comma-separated list of at most 100 character GUIDs; provide this or names.
          schema: {type: string, pattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$'}
        - name: names
          in: query
          required: false
          description: Comma-separated exact character names, at most 40; provide this or guids.
          schema: {type: string}
      responses:
        '200':
          description: Average item level for each requested character
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [guid, name, itemLevel]
                      properties:
                        guid: {type: integer, format: int64, maximum: 4294967295}
                        name: {type: string}
                        itemLevel: {type: integer, format: int32, minimum: 0}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/CharacterUnavailable'}
  /api/v1/characters/statistics:
    get:
      tags: [Characters]
      summary: Read online character latency and faction counts
      responses:
        '200':
          description: Current online character statistics
          content:
            application/json:
              schema:
                type: object
                required: [latencyMs, factionCounts]
                properties:
                  latencyMs: {type: integer, nullable: true}
                  factionCounts:
                    type: object
                    required: [alliance, horde]
                    properties:
                      alliance: {type: integer, minimum: 0}
                      horde: {type: integer, minimum: 0}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/CharacterUnavailable'}
  /api/v1/instance-binds:
    get:
      tags: [Characters]
      summary: List current-realm character instance binds
      description: Includes online and offline characters. Returns an empty data array when no binds exist. Binds are read from the character database; online and in-instance flags use the live snapshot.
      responses:
        '200':
          description: Instance bind snapshot
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/InstanceBind'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/CharacterUnavailable'}
  /api/v1/instance-binds/reset:
    post:
      tags: [Characters]
      summary: Remove selected character binds for one map and difficulty
      description: Queues the operation on the world thread. For an online character inside the requested instance, starts a homebind teleport even in combat; the core teleport path ends combat. Returns pending until the caller confirms the character left and retries the reset. A failed teleport or a character no longer bound is skipped. In cluster mode, a worldserver that does not own the map also skips the operation. Does not alter the global reset schedule.
      parameters:
        - name: mapId
          in: query
          required: true
          schema: {type: integer, format: int32, minimum: 1}
        - name: difficulty
          in: query
          required: true
          schema: {type: integer, format: int32, minimum: 0, maximum: 3}
        - name: guids
          in: query
          required: true
          description: Comma-separated list of 1 to 100 unique character GUIDs.
          schema: {type: string, pattern: '^[1-9][0-9]*(,[1-9][0-9]*){0,99}$'}
      responses:
        '200':
          description: Per-character outcomes
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: {$ref: '#/components/schemas/InstanceBindResetResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/QueueFull'}
  /api/v1/groups:
    get:
      tags: [Groups]
      summary: List groups visible through online players
      responses:
        '200':
          description: Groups snapshot
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Group'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/groups/{id}:
    get:
      tags: [Groups]
      summary: Get one group
      parameters: [{$ref: '#/components/parameters/ResourceId'}]
      responses:
        '200':
          description: Group snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/instances:
    get:
      tags: [Instances]
      summary: List active dungeon and raid instances
      responses:
        '200':
          description: Instances snapshot
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Instance'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/instances/{instanceId}:
    get:
      tags: [Instances]
      summary: Get one active instance
      parameters: [{$ref: '#/components/parameters/InstanceId'}]
      responses:
        '200':
          description: Instance snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Instance'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/bots:
    get:
      tags: [Bots]
      summary: List online playerbots
      description: Returns 501 when mod-playerbots is not compiled into worldserver.
      responses:
        '200':
          description: Online bots
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Player'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '501': {$ref: '#/components/responses/NotSupported'}
  /api/v1/players/{guid}/kick:
    post:
      tags: [Commands]
      summary: Queue a player kick
      description: The command is executed on the next world update.
      parameters: [{$ref: '#/components/parameters/Guid'}]
      responses:
        '202':
          description: Command queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueuedCommand'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/QueueFull'}
  /api/v1/players/{guid}/teleport:
    post:
      tags: [Commands]
      summary: Queue a player teleport
      parameters:
        - {$ref: '#/components/parameters/Guid'}
        - {name: mapId, in: query, required: true, schema: {type: integer, format: int32, minimum: 0}}
        - {name: x, in: query, required: true, schema: {type: number, format: float}}
        - {name: y, in: query, required: true, schema: {type: number, format: float}}
        - {name: z, in: query, required: true, schema: {type: number, format: float}}
        - {name: orientation, in: query, required: true, schema: {type: number, format: float}}
      responses:
        '202':
          description: Command queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueuedCommand'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/QueueFull'}
components:
  parameters:
    Guid:
      name: guid
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    CharacterGuid:
      name: guid
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1, maximum: 4294967295}
    ResourceId:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    InstanceId:
      name: instanceId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    Name:
      name: name
      in: query
      required: false
      schema: {type: string}
    MapId:
      name: mapId
      in: query
      required: false
      schema: {type: integer, format: int64, minimum: 0, maximum: 4294967295}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 1, maximum: 1000, default: 100}
    CharacterLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 1, maximum: 1000, default: 100}
    CharacterCursor:
      name: cursor
      in: query
      required: false
      description: Exclusive GUID cursor returned as nextCursor by the previous page.
      schema: {type: integer, format: int32, minimum: 0}
    CharacterName:
      name: name
      in: query
      required: false
      description: Case-insensitive name prefix.
      schema: {type: string, maxLength: 64}
    CharacterAccountId:
      name: accountId
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 1}
    CharacterOnline:
      name: online
      in: query
      required: false
      schema: {type: boolean}
    CharacterBot:
      name: bot
      in: query
      required: false
      schema: {type: boolean}
    CharacterBotType:
      name: botType
      in: query
      required: false
      schema: {type: string, enum: [player, random, addclass, unknown]}
    CharacterRace:
      name: race
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 1, maximum: 255}
    CharacterClass:
      name: class
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 1, maximum: 255}
    CharacterMinLevel:
      name: minLevel
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 1, maximum: 255}
    CharacterMaxLevel:
      name: maxLevel
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 1, maximum: 255}
    CharacterGuildId:
      name: guildId
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 1}
    CharacterMapId:
      name: mapId
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 0}
    CharacterZoneId:
      name: zoneId
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 0}
    CharacterIncludeDeleted:
      name: includeDeleted
      in: query
      required: false
      description: Include soft-deleted rows in list results. Deleted profiles remain hidden.
      schema: {type: boolean, default: false}
    CharacterIncludeTalents:
      name: includeTalents
      in: query
      required: false
      description: Include active talent spell IDs and specialization summary resolved from server DBC data.
      schema: {type: boolean, default: false}
    CharacterGUIDs:
      name: guids
      in: query
      required: false
      description: Comma-separated list of at most 100 character GUIDs.
      schema: {type: string, pattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$'}
    CharacterExactNames:
      name: names
      in: query
      required: false
      description: Comma-separated exact character names, at most 40 entries.
      schema: {type: string}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: The configured authentication provider rejected the request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Account already exists
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AccountOperationResult'}
    NotSupported:
      description: Optional integration is unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    QueueFull:
      description: World-thread command queue is full
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    CharacterUnavailable:
      description: Character database unavailable or character request capacity reached
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    AccountMutationAvailability:
      type: object
      required: [available, create, security]
      properties:
        available: {type: boolean}
        create: {type: boolean}
        security: {type: boolean}
    AccountCreateRequest:
      type: object
      required: [username, password, email, securityLevel, realmId]
      properties:
        username: {type: string, minLength: 1, maxLength: 17, pattern: '^[A-Za-z0-9]+$'}
        password: {type: string, minLength: 1, maxLength: 16, pattern: '^\S+$', writeOnly: true}
        email: {type: string, maxLength: 255}
        securityLevel: {type: integer, minimum: 0, maximum: 3}
        realmId: {type: integer, format: int32, description: '-1 for all realms or a configured realm ID'}
    AccountSecurityRequest:
      type: object
      required: [securityLevel, realmId]
      properties:
        securityLevel: {type: integer, minimum: 0, maximum: 3}
        realmId: {type: integer, format: int32, description: '-1 for all realms or a configured realm ID'}
    AccountOperationResult:
      type: object
      required: [status, message, accountId, steps]
      properties:
        status: {type: string, enum: [completed, partial, rejected]}
        message: {type: string}
        accountId: {type: integer, format: int64, maximum: 4294967295}
        steps:
          type: array
          items:
            type: object
            required: [id, status, message]
            properties:
              id: {type: string}
              status: {type: string, enum: [completed, failed, pending]}
              message: {type: string}
    InstanceBind:
      type: object
      required: [guid, name, class, level, online, mapId, mapName, isRaid, difficulty, permanent, extended, resetAt, completedEncounters, inInstance]
      properties:
        guid: {type: integer, format: int64, maximum: 4294967295}
        name: {type: string}
        class: {type: integer, minimum: 1, maximum: 11}
        level: {type: integer, minimum: 1, maximum: 255}
        online: {type: boolean}
        mapId: {type: integer, format: int32}
        mapName: {type: string}
        isRaid: {type: boolean}
        difficulty: {type: integer, minimum: 0, maximum: 3}
        permanent: {type: boolean}
        extended: {type: boolean}
        resetAt: {type: integer, format: int64, minimum: 0, description: Unix timestamp in seconds}
        completedEncounters: {type: integer, format: int32, minimum: 0}
        inInstance: {type: boolean}
    InstanceBindResetResult:
      type: object
      required: [guid, status]
      properties:
        guid: {type: integer, format: int64, maximum: 4294967295}
        status: {type: string, enum: [reset, pending, skipped, failed]}
        reason: {type: string}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code: {type: string}
            feature: {type: string}
    HealthResponse:
      type: object
      required: [status]
      properties: {status: {type: string, enum: [ok]}}
    ReadyResponse:
      type: object
      required: [status]
      properties: {status: {type: string, enum: [ready]}}
    ServerSnapshot:
      type: object
      required: [realmId, serverTime, uptimeSeconds, playersOnline, botsOnline]
      properties:
        realmId: {type: integer, format: int32}
        serverTime: {type: integer, format: int64}
        uptimeSeconds: {type: integer, format: int64}
        playersOnline: {type: integer, format: int32}
        botsOnline: {type: integer, format: int32}
    ServerMetrics:
      type: object
      required: [activeMaps, activeInstances, playersOnline, botsOnline, eventQueue, commandQueue, droppedEvents]
      properties:
        activeMaps: {type: integer, format: int32}
        activeInstances: {type: integer, format: int32}
        playersOnline: {type: integer, format: int32}
        botsOnline: {type: integer, format: int32}
        eventQueue: {type: integer, format: int64}
        commandQueue: {type: integer, format: int64}
        droppedEvents: {type: integer, format: int64}
    ModuleDescriptor:
      type: object
      required: [name, version, capabilities]
      properties:
        name: {type: string}
        version: {type: string}
        capabilities:
          type: array
          items: {type: string}
    Player:
      type: object
      required: [guid, name, level, class, race, mapId, zoneId, online]
      properties:
        guid: {type: integer, format: int64}
        name: {type: string}
        level: {type: integer, format: int32}
        class: {type: integer, format: int32}
        race: {type: integer, format: int32}
        mapId: {type: integer, format: int32}
        zoneId: {type: integer, format: int32}
        online: {type: boolean, enum: [true]}
    PlayerDetails:
      allOf:
        - {$ref: '#/components/schemas/Player'}
        - type: object
          properties:
            health: {type: object}
            power: {type: object}
            position: {type: object}
    CharacterPage:
      type: object
      required: [data, hasMore, nextCursor]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Character'}
        hasMore: {type: boolean}
        nextCursor: {type: integer, format: int64, nullable: true, maximum: 4294967295}
    Character:
      type: object
      required: [guid, accountId, name, race, class, gender, level, guildId, guildName, online, available, bot, botType, deleted, mapId, zoneId, location]
      properties:
        guid: {type: integer, format: int64, maximum: 4294967295}
        accountId: {type: integer, format: int64, maximum: 4294967295}
        name: {type: string}
        race: {type: integer, format: int32}
        class: {type: integer, format: int32}
        gender: {type: integer, format: int32}
        level: {type: integer, format: int32}
        guildId: {type: integer, format: int64, maximum: 4294967295}
        guildName: {type: string}
        online: {type: boolean}
        available: {type: boolean, description: Offline or not currently assigned to a group}
        talentSpells:
          type: array
          description: Present only when includeTalents=true; contains active talent spell IDs.
          items: {type: integer, format: int32}
        spec:
          type: string
          description: Present with includeTalents=true or on character profiles; active talent tree name, or empty when no talent points are spent.
        talentPoints:
          type: array
          description: Present with includeTalents=true or on character profiles; points spent in tree order 0, 1, 2.
          minItems: 3
          maxItems: 3
          items: {type: integer, format: int32}
        suggestedRoles:
          type: array
          description: Present with includeTalents=true or on character profiles; role suggestions derived from class and active talent tree.
          items: {type: string, enum: [tank, healer, dps]}
        bot: {type: boolean}
        botType: {type: string, enum: [player, random, addclass, unknown]}
        deleted: {type: boolean}
        mapId: {type: integer, format: int32}
        zoneId: {type: integer, format: int32}
        location:
          type: object
          required: [mapId, zoneId, x, y, z, orientation]
          properties:
            mapId: {type: integer, format: int32}
            zoneId: {type: integer, format: int32}
            x: {type: number, format: float}
            y: {type: number, format: float}
            z: {type: number, format: float}
            orientation: {type: number, format: float}
    CharacterEnchantmentProc:
      type: object
      required: [customChance, ppmChance, procEx, attributeMask]
      properties:
        customChance: {type: integer, format: int64}
        ppmChance: {type: number, format: float}
        procEx: {type: integer, format: int64}
        attributeMask: {type: integer, format: int64}
    CharacterSpellProc:
      type: object
      required: [schoolMask, spellFamilyName, spellFamilyMask, procFlags, spellTypeMask, spellPhaseMask, hitMask, attributesMask, disableEffectsMask, procsPerMinute, chance, cooldownMs, charges]
      properties:
        schoolMask: {type: integer, format: int64}
        spellFamilyName: {type: integer, format: int64}
        spellFamilyMask:
          type: array
          minItems: 3
          maxItems: 3
          items: {type: integer, format: int64}
        procFlags: {type: integer, format: int64}
        spellTypeMask: {type: integer, format: int64}
        spellPhaseMask: {type: integer, format: int64}
        hitMask: {type: integer, format: int64}
        attributesMask: {type: integer, format: int64}
        disableEffectsMask: {type: integer, format: int64}
        procsPerMinute: {type: number, format: float}
        chance: {type: number, format: float}
        cooldownMs: {type: integer, format: int64}
        charges: {type: integer, format: int64}
    CharacterStats:
      type: object
      required: [source, primaryAttributes, health, powers, armor, resistances, combat]
      properties:
        source: {type: string, enum: [live, saved]}
        primaryAttributes:
          type: object
          required: [strength, agility, stamina, intellect, spirit]
          properties:
            strength: {type: integer, format: int64}
            agility: {type: integer, format: int64}
            stamina: {type: integer, format: int64}
            intellect: {type: integer, format: int64}
            spirit: {type: integer, format: int64}
        health:
          type: object
          required: [current, maximum]
          properties:
            current: {type: integer, format: int64, nullable: true}
            maximum: {type: integer, format: int64}
        powers:
          type: array
          items:
            type: object
            required: [type, current, maximum]
            properties:
              type: {type: string, enum: [mana, rage, focus, energy, happiness, rune, runicPower]}
              current: {type: integer, format: int64, nullable: true}
              maximum: {type: integer, format: int64}
        armor: {type: integer, format: int64}
        resistances:
          type: object
          required: [holy, fire, nature, frost, shadow, arcane]
          properties:
            holy: {type: integer, format: int64}
            fire: {type: integer, format: int64}
            nature: {type: integer, format: int64}
            frost: {type: integer, format: int64}
            shadow: {type: integer, format: int64}
            arcane: {type: integer, format: int64}
        combat:
          type: object
          required: [attackPower, rangedAttackPower, spellPower, resilience, blockPct, dodgePct, parryPct, critPct, rangedCritPct, spellCritPct]
          properties:
            attackPower: {type: integer, format: int64}
            rangedAttackPower: {type: integer, format: int64}
            spellPower: {type: integer, format: int64}
            resilience: {type: integer, format: int64}
            blockPct: {type: number, format: float}
            dodgePct: {type: number, format: float}
            parryPct: {type: number, format: float}
            critPct: {type: number, format: float}
            rangedCritPct: {type: number, format: float}
            spellCritPct: {type: number, format: float}
    CharacterProfile:
      allOf:
        - {$ref: '#/components/schemas/Character'}
        - type: object
          required: [xp, money, talents, equipmentMetadataVersion, equipment, stats, professions]
          properties:
            xp: {type: integer, format: int64, maximum: 4294967295}
            money: {type: integer, format: int64, maximum: 4294967295}
            talents:
              type: object
              required: [activeGroup, totalGroups]
              properties:
                activeGroup: {type: integer, format: int32}
                totalGroups: {type: integer, format: int32}
            equipmentMetadataVersion: {type: integer, format: int32, enum: [2], description: Equipment template and effect fields included in the response}
            stats:
              nullable: true
              allOf:
                - {$ref: '#/components/schemas/CharacterStats'}
            equipment:
              type: array
              items:
                type: object
                required: [slot, itemEntry, instanceGuid, randomPropertyId, randomPropertyEnchantments, sockets, spells, enchantments, itemSetBonuses]
                properties:
                  slot: {type: integer, format: int32}
                  itemEntry: {type: integer, format: int32}
                  instanceGuid: {type: integer, format: int64, minimum: 1, maximum: 4294967295, description: Unsigned 32-bit item instance GUID from item_instance}
                  randomPropertyId: {type: integer, format: int32, description: Signed item random property or suffix ID from item_instance}
                  randomPropertyName: {type: string}
                  randomPropertyNameRu: {type: string}
                  randomPropertyEnchantments:
                    type: array
                    items:
                      type: object
                      required: [id, allocationPct, name, nameRu, proc, effects]
                      properties:
                        id: {type: integer, format: int64}
                        allocationPct: {type: integer, format: int64}
                        name: {type: string, description: English random-property enchantment name}
                        nameRu: {type: string, description: Russian random-property enchantment name; falls back to name when no translation exists}
                        proc:
                          nullable: true
                          allOf:
                            - {$ref: '#/components/schemas/CharacterEnchantmentProc'}
                        effects:
                          type: array
                          items:
                            type: object
                            required: [type, amount, spellId]
                            properties:
                              type: {type: integer, format: int64}
                              amount: {type: integer, format: int64}
                              spellId: {type: integer, format: int64}
                  displayId: {type: integer, format: int32}
                  name: {type: string, description: English item name}
                  nameRu: {type: string, description: Russian item name; falls back to name when no translation exists}
                  quality: {type: integer, format: int32}
                  itemLevel: {type: integer, format: int32}
                  requiredLevel: {type: integer, format: int32}
                  inventoryType: {type: integer, format: int32}
                  itemClass: {type: integer, format: int32}
                  itemSubclass: {type: integer, format: int32}
                  flags: {type: integer, format: int64}
                  maxCount: {type: integer, format: int32}
                  bonding: {type: integer, format: int32}
                  armor: {type: integer, format: int32}
                  block: {type: integer, format: int32}
                  delayMs: {type: integer, format: int32}
                  durability: {type: integer, format: int32}
                  maxDurability: {type: integer, format: int32}
                  rangedModRange: {type: number, format: float}
                  sellPrice: {type: integer, format: int64}
                  allowableClass: {type: integer, format: int64}
                  allowableRace: {type: integer, format: int64}
                  requiredSkill: {type: integer, format: int64}
                  requiredSkillRank: {type: integer, format: int64}
                  requiredSpell: {type: integer, format: int64}
                  requiredHonorRank: {type: integer, format: int64}
                  requiredCityRank: {type: integer, format: int64}
                  requiredReputationFaction: {type: integer, format: int64}
                  requiredReputationRank: {type: integer, format: int64}
                  itemSetId: {type: integer, format: int64}
                  itemSetName: {type: string}
                  itemSetNameRu: {type: string}
                  itemSetEquippedCount: {type: integer, format: int32}
                  itemSetBonuses:
                    type: array
                    items:
                      type: object
                      required: [requiredItems, spellId, spellName, spellNameRu, proc, active, effects]
                      properties:
                        requiredItems: {type: integer, format: int32}
                        spellId: {type: integer, format: int64}
                        spellName: {type: string}
                        spellNameRu: {type: string}
                        proc:
                          nullable: true
                          allOf:
                            - {$ref: '#/components/schemas/CharacterSpellProc'}
                        active: {type: boolean}
                        effects:
                          type: array
                          items:
                            type: object
                            required: [index, type, auraType, basePoints, dieSides, realPointsPerLevel, triggerSpell, miscValue, miscValueB, amplitudeMs]
                            properties:
                              index: {type: integer, format: int32}
                              type: {type: integer, format: int64}
                              auraType: {type: integer, format: int64}
                              basePoints: {type: integer, format: int32}
                              dieSides: {type: integer, format: int32}
                              realPointsPerLevel: {type: number, format: float}
                              triggerSpell: {type: integer, format: int64}
                              miscValue: {type: integer, format: int32}
                              miscValueB: {type: integer, format: int32}
                              amplitudeMs: {type: integer, format: int64}
                  itemLimitCategory: {type: integer, format: int32}
                  itemLimitCategoryName: {type: string}
                  socketBonus: {type: integer, format: int64}
                  socketBonusName: {type: string}
                  socketBonusNameRu: {type: string}
                  socketBonusProc:
                    nullable: true
                    allOf:
                      - {$ref: '#/components/schemas/CharacterEnchantmentProc'}
                  socketBonusEffects:
                    type: array
                    items:
                      type: object
                      required: [type, amount, spellId]
                      properties:
                        type: {type: integer, format: int64}
                        amount: {type: integer, format: int64}
                        spellId: {type: integer, format: int64}
                  gemProperties: {type: integer, format: int64}
                  sockets:
                    type: array
                    items:
                      type: object
                      required: [color, content]
                      properties:
                        color: {type: integer, format: int32}
                        content: {type: integer, format: int64}
                  spells:
                    type: array
                    items:
                      type: object
                      required: [id, trigger, charges, ppmRate, cooldownMs, category, categoryCooldownMs, name, nameRu, proc, effects]
                      properties:
                        id: {type: integer, format: int32}
                        trigger: {type: integer, format: int32}
                        charges: {type: integer, format: int32}
                        ppmRate: {type: number, format: float}
                        cooldownMs: {type: integer, format: int32}
                        category: {type: integer, format: int32}
                        categoryCooldownMs: {type: integer, format: int32}
                        name: {type: string}
                        nameRu: {type: string}
                        proc:
                          nullable: true
                          allOf:
                            - {$ref: '#/components/schemas/CharacterSpellProc'}
                        effects:
                          type: array
                          items:
                            type: object
                            required: [index, type, auraType, basePoints, dieSides, realPointsPerLevel, triggerSpell, miscValue, miscValueB, amplitudeMs]
                            properties:
                              index: {type: integer, format: int32}
                              type: {type: integer, format: int64}
                              auraType: {type: integer, format: int64}
                              basePoints: {type: integer, format: int32}
                              dieSides: {type: integer, format: int32}
                              realPointsPerLevel: {type: number, format: float}
                              triggerSpell: {type: integer, format: int64}
                              miscValue: {type: integer, format: int32}
                              miscValueB: {type: integer, format: int32}
                              amplitudeMs: {type: integer, format: int64}
                  enchantments:
                    type: array
                    items:
                      type: object
                      required: [slot, id, durationMs, charges, name, nameRu, gemId, proc, effects]
                      properties:
                        slot: {type: integer, format: int32, minimum: 0, maximum: 11}
                        id: {type: integer, format: int64}
                        durationMs: {type: integer, format: int64}
                        charges: {type: integer, format: int64}
                        name: {type: string, description: English enchantment name}
                        nameRu: {type: string, description: Russian enchantment name; falls back to name when no translation exists}
                        gemId: {type: integer, format: int64}
                        proc:
                          nullable: true
                          allOf:
                            - {$ref: '#/components/schemas/CharacterEnchantmentProc'}
                        effects:
                          type: array
                          items:
                            type: object
                            required: [type, amount, spellId]
                            properties:
                              type: {type: integer, format: int64}
                              amount: {type: integer, format: int64}
                              spellId: {type: integer, format: int64}
                  stats:
                    type: array
                    items:
                      type: object
                      required: [type, value]
                      properties:
                        type: {type: integer, format: int32}
                        value: {type: integer, format: int32}
                  damage:
                    type: array
                    items:
                      type: object
                      required: [min, max, type]
                      properties:
                        min: {type: number, format: float}
                        max: {type: number, format: float}
                        type: {type: integer, format: int32}
                  soulbound: {type: boolean}
                  resistances:
                    type: object
                    required: [holy, fire, nature, frost, shadow, arcane]
                    properties:
                      holy: {type: integer, format: int32}
                      fire: {type: integer, format: int32}
                      nature: {type: integer, format: int32}
                      frost: {type: integer, format: int32}
                      shadow: {type: integer, format: int32}
                      arcane: {type: integer, format: int32}
                  unknownTemplate: {type: boolean}
            professions:
              type: array
              items:
                type: object
                required: [skillId, name, value, max]
                properties:
                  skillId: {type: integer, format: int32}
                  name: {type: string}
                  value: {type: integer, format: int32}
                  max: {type: integer, format: int32}
    Group:
      type: object
      required: [id, leaderGuid, raid, members]
      properties:
        id: {type: integer, format: int64}
        leaderGuid: {type: integer, format: int64}
        raid: {type: boolean}
        members:
          type: array
          items: {type: integer, format: int64}
    Instance:
      type: object
      required: [instanceId, mapId, difficulty, players]
      properties:
        instanceId: {type: integer, format: int32}
        mapId: {type: integer, format: int32}
        difficulty: {type: integer, format: int32}
        players: {type: integer, format: int32}
    QueuedCommand:
      type: object
      required: [status, operation]
      properties:
        status: {type: string, enum: [queued]}
        operation: {type: string}
        guid: {type: integer, format: int64}
