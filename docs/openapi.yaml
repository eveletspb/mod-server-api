openapi: 3.0.3
info:
  title: mod-server-api
  version: 0.1.0
  description: Runtime HTTP API for an AzerothCore WotLK worldserver.
servers:
  - url: http://127.0.0.1:7878
    description: Default local listener
tags:
  - name: Health
  - name: Server
  - name: Players
  - name: Groups
  - name: Instances
  - name: Bots
  - name: Dungeon Clear
  - name: Accounts
  - name: Commands
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        '200':
          description: API process is alive
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
  /ready:
    get:
      tags: [Health]
      summary: Readiness probe
      responses:
        '200':
          description: API is ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadyResponse'}
  /api/v1/server:
    get:
      tags: [Server]
      security: [{bearerAuth: []}]
      summary: Runtime server snapshot
      responses:
        '200':
          description: Server snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServerSnapshot'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/server/metrics:
    get:
      tags: [Server]
      security: [{bearerAuth: []}]
      summary: Runtime server metrics
      responses:
        '200':
          description: Server metrics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServerMetrics'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/players:
    get:
      tags: [Players]
      security: [{bearerAuth: []}]
      summary: List online players
      parameters:
        - {$ref: '#/components/parameters/Name'}
        - {$ref: '#/components/parameters/MapId'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Online players
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Player'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/players/{guid}:
    get:
      tags: [Players]
      security: [{bearerAuth: []}]
      summary: Get one online player
      parameters: [{$ref: '#/components/parameters/Guid'}]
      responses:
        '200':
          description: Player details
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlayerDetails'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/groups:
    get:
      tags: [Groups]
      security: [{bearerAuth: []}]
      summary: List groups visible through online players
      responses:
        '200':
          description: Groups snapshot
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Group'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/groups/{id}:
    get:
      tags: [Groups]
      security: [{bearerAuth: []}]
      summary: Get one group
      parameters: [{$ref: '#/components/parameters/ResourceId'}]
      responses:
        '200':
          description: Group snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/instances:
    get:
      tags: [Instances]
      security: [{bearerAuth: []}]
      summary: List active dungeon and raid instances
      responses:
        '200':
          description: Instances snapshot
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Instance'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/instances/{instanceId}:
    get:
      tags: [Instances]
      security: [{bearerAuth: []}]
      summary: Get one active instance
      parameters: [{$ref: '#/components/parameters/InstanceId'}]
      responses:
        '200':
          description: Instance snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Instance'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/bots:
    get:
      tags: [Bots]
      security: [{bearerAuth: []}]
      summary: List online playerbots
      description: Returns 501 when mod-playerbots is not compiled into worldserver.
      responses:
        '200':
          description: Online bots
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Player'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '501': {$ref: '#/components/responses/NotSupported'}
  /api/v1/accounts/{account}:
    get:
      tags: [Accounts]
      security: [{bearerAuth: []}]
      summary: Get administrative account details
      parameters:
        - {name: account, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Account details, content: {application/json: {schema: {type: object}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/accounts/{account}/characters:
    get:
      tags: [Accounts]
      security: [{bearerAuth: []}]
      summary: List account characters
      parameters:
        - {name: account, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Account characters, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/accounts/create:
    post:
      tags: [Accounts]
      security: [{bearerAuth: []}]
      summary: Queue account creation
      parameters:
        - {name: username, in: query, required: true, schema: {type: string}}
        - {name: password, in: query, required: true, schema: {type: string, format: password}}
        - {name: email, in: query, required: false, schema: {type: string, format: email}}
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueuedCommand'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/QueueFull'}
  /api/v1/dungeon-clear/dungeons:
    get:
      tags: [Dungeon Clear]
      security: [{bearerAuth: []}]
      summary: List supported dungeon-clear dungeons and raids
      responses:
        '200':
          description: Dungeon-clear catalog
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [token, name, mapId, recommendedLevel, heroic, raid]
                      properties:
                        token: {type: string}
                        name: {type: string}
                        mapId: {type: integer, format: int32}
                        recommendedLevel: {type: integer, format: int32}
                        heroic: {type: boolean}
                        heroicLevel: {type: integer, format: int32}
                        raid: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '501': {$ref: '#/components/responses/NotSupported'}
  /api/v1/dungeon-clear/runs:
    get:
      tags: [Dungeon Clear]
      security: [{bearerAuth: []}]
      summary: Get active dungeon-clear run status
      responses:
        '200':
          description: Live run snapshot
          content:
            application/json:
              schema: {type: object}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '501': {$ref: '#/components/responses/NotSupported'}
  /api/v1/dungeon-clear/runs/start:
    post:
      tags: [Dungeon Clear]
      security: [{bearerAuth: []}]
      summary: Queue a dungeon or raid test run
      parameters:
        - {name: dungeon, in: query, required: true, schema: {type: string}}
        - {name: heroic, in: query, required: false, schema: {type: boolean}}
        - {name: size, in: query, required: false, schema: {type: integer, minimum: 2, maximum: 40}}
        - {name: level, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 80}}
        - {name: seed, in: query, required: false, schema: {type: integer, minimum: 0}}
      responses:
        '202':
          description: World-thread command queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueuedCommand'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '501': {$ref: '#/components/responses/NotSupported'}
        '503': {$ref: '#/components/responses/QueueFull'}
  /api/v1/dungeon-clear/runs/stop:
    post:
      tags: [Dungeon Clear]
      security: [{bearerAuth: []}]
      summary: Queue cancellation of an active run
      parameters:
        - {name: selector, in: query, required: true, schema: {type: string, example: all}}
      responses:
        '202':
          description: World-thread command queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueuedCommand'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '501': {$ref: '#/components/responses/NotSupported'}
        '503': {$ref: '#/components/responses/QueueFull'}
  /api/v1/players/{guid}/kick:
    post:
      tags: [Commands]
      security: [{bearerAuth: []}]
      summary: Queue a player kick
      description: The command is executed on the next world update.
      parameters: [{$ref: '#/components/parameters/Guid'}]
      responses:
        '202':
          description: Command queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueuedCommand'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/QueueFull'}
  /api/v1/players/{guid}/teleport:
    post:
      tags: [Commands]
      security: [{bearerAuth: []}]
      summary: Queue a player teleport
      parameters:
        - {$ref: '#/components/parameters/Guid'}
        - {name: mapId, in: query, required: true, schema: {type: integer, format: int32, minimum: 0}}
        - {name: x, in: query, required: true, schema: {type: number, format: float}}
        - {name: y, in: query, required: true, schema: {type: number, format: float}}
        - {name: z, in: query, required: true, schema: {type: number, format: float}}
        - {name: orientation, in: query, required: true, schema: {type: number, format: float}}
      responses:
        '202':
          description: Command queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueuedCommand'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/QueueFull'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Optional when ServerApi.Auth.Enable is 0 on localhost.
  parameters:
    Guid:
      name: guid
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    ResourceId:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    InstanceId:
      name: instanceId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    Name:
      name: name
      in: query
      required: false
      schema: {type: string}
    MapId:
      name: mapId
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 0}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 1, maximum: 1000, default: 100}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotSupported:
      description: Optional integration is unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    QueueFull:
      description: World-thread command queue is full
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code: {type: string}
            feature: {type: string}
    HealthResponse:
      type: object
      required: [status]
      properties: {status: {type: string, enum: [ok]}}
    ReadyResponse:
      type: object
      required: [status]
      properties: {status: {type: string, enum: [ready]}}
    ServerSnapshot:
      type: object
      required: [realmId, serverTime, uptimeSeconds, playersOnline, botsOnline]
      properties:
        realmId: {type: integer, format: int32}
        serverTime: {type: integer, format: int64}
        uptimeSeconds: {type: integer, format: int64}
        playersOnline: {type: integer, format: int32}
        botsOnline: {type: integer, format: int32}
    ServerMetrics:
      type: object
      required: [activeMaps, activeInstances, playersOnline, botsOnline, eventQueue, commandQueue, droppedEvents]
      properties:
        activeMaps: {type: integer, format: int32}
        activeInstances: {type: integer, format: int32}
        playersOnline: {type: integer, format: int32}
        botsOnline: {type: integer, format: int32}
        eventQueue: {type: integer, format: int64}
        commandQueue: {type: integer, format: int64}
        droppedEvents: {type: integer, format: int64}
    Player:
      type: object
      required: [guid, name, level, class, race, mapId, zoneId, online]
      properties:
        guid: {type: integer, format: int64}
        name: {type: string}
        level: {type: integer, format: int32}
        class: {type: integer, format: int32}
        race: {type: integer, format: int32}
        mapId: {type: integer, format: int32}
        zoneId: {type: integer, format: int32}
        online: {type: boolean, enum: [true]}
    PlayerDetails:
      allOf:
        - {$ref: '#/components/schemas/Player'}
        - type: object
          properties:
            health: {type: object}
            power: {type: object}
            position: {type: object}
    Group:
      type: object
      required: [id, leaderGuid, raid, members]
      properties:
        id: {type: integer, format: int64}
        leaderGuid: {type: integer, format: int64}
        raid: {type: boolean}
        members:
          type: array
          items: {type: integer, format: int64}
    Instance:
      type: object
      required: [instanceId, mapId, difficulty, players]
      properties:
        instanceId: {type: integer, format: int32}
        mapId: {type: integer, format: int32}
        difficulty: {type: integer, format: int32}
        players: {type: integer, format: int32}
    QueuedCommand:
      type: object
      required: [status, operation]
      properties:
        status: {type: string, enum: [queued]}
        operation: {type: string}
        guid: {type: integer, format: int64}
        accountId: {type: integer, format: int32}
